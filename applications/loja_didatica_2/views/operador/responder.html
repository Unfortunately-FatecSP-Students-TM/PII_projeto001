{{extend 'layout.html'}}
{{response.title = 'Responder reclamação'}}
<p class="pequeno"><a href="{{=URL('operador', 'reclamacoes')}}">Reclamações</a> › {{=pedido.codigo}}</p>
<div class="cartao cartao-estreito" style="margin:0 auto">
  <h1>Responder reclamação</h1>
  <p class="texto-2">Pedido <a class="mono" href="{{=URL('operador', 'pedido', args=[pedido.id])}}">{{=pedido.codigo}}</a> · {{=nome_usuario(cliente)}} · {{=data_br(r.criado_em)}}</p>
  <div class="mensagem"><div class="texto">{{=r.texto}}</div></div>
  <form method="post" action="{{=URL('operador', 'responder', args=[r.id])}}">
    <input type="hidden" name="_csrf" value="{{=csrf_token()}}">
    <div class="campo"><label for="status">Situação</label>
      <select id="status" name="status">
        {{for s in STATUS_RECLAMACAO:}}<option value="{{=s}}" {{='selected' if s == r.status else ''}}>{{=rotulo_reclamacao(s)}}</option>{{pass}}
      </select></div>
    <div class="campo"><label for="resposta">Resposta ao cliente</label>
      <textarea id="resposta" name="resposta">{{=r.resposta or ''}}</textarea></div>
    <div class="formulario-acoes">
      <button class="btn btn-primario" type="submit">Salvar resposta</button>
      <a class="btn btn-secundario" href="{{=URL('operador', 'reclamacoes')}}">Cancelar</a>
    </div>
  </form>
</div>
