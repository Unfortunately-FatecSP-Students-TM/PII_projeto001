{{extend 'layout.html'}}
{{response.title = 'Catálogo'}}
<div class="cabecalho-pagina">
  <div>
    <h1>Catálogo</h1>
    <p>Busque, escolha a quantidade e adicione ao carrinho. A lista abaixo é montada pelo React a partir da API JSON da loja.</p>
  </div>
</div>

<div id="app-catalogo" data-busca="{{=busca}}">
  <noscript>
    <div class="aviso aviso-alerta">Este catálogo interativo precisa de JavaScript. Os produtos abaixo são a versão simplificada.</div>
    <div class="grade-produtos">
      {{for p in db(db.produto.ativo == True).select(orderby=db.produto.nome):}}
      <article class="produto-card">
        <a class="foto" href="{{=URL('default', 'produto', args=[p.id])}}"><img src="{{=url_imagem(p)}}" alt="{{=p.nome}}"></a>
        <div class="corpo">
          <a class="nome" href="{{=URL('default', 'produto', args=[p.id])}}">{{=p.nome}}</a>
          <span class="preco">{{=moeda(p.preco)}}</span>
        </div>
      </article>
      {{pass}}
    </div>
  </noscript>
  <p class="carregando">Carregando catálogo…</p>
</div>

{{block scripts}}
{{componente = 'catalogo'}}
{{include 'react.html'}}
{{end}}
