{{extend 'layout.html'}}
{{response.title = 'Carrinho'}}
{{import json}}
<div class="cabecalho-pagina">
  <div>
    <h1>Meu carrinho</h1>
    <p>Altere quantidades ou remova itens. O estoque só é reservado quando você finaliza.</p>
  </div>
</div>

<div id="app-carrinho" data-inicial="{{=json.dumps(resumo, ensure_ascii=False)}}">
  <noscript>
    <div class="cartao">
      {{for i in resumo['itens']:}}
      <div class="item-carrinho"><img src="{{=i['imagem']}}" alt="">
        <div><a class="nome" href="{{=i['url']}}">{{=i['nome']}}</a>
        <div class="meta">{{=i['quantidade']}} × {{=i['preco_fmt']}} = <strong>{{=i['subtotal_fmt']}}</strong></div></div></div>
      {{pass}}
      {{if resumo['itens']:}}
      <form method="post" action="{{=URL('cliente', 'checkout')}}" class="mt-1">
        <input type="hidden" name="_csrf" value="{{=csrf_token()}}">
        <p class="resumo-total">Total: {{=resumo['total_fmt']}}</p>
        <button class="btn btn-primario" type="submit">Finalizar e pagar com PIX</button>
      </form>
      {{else:}}<p class="vazio-caixa">Seu carrinho está vazio.</p>{{pass}}
    </div>
  </noscript>
</div>

{{block scripts}}
{{componente = 'carrinho'}}
{{include 'react.html'}}
{{end}}
